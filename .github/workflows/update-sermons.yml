name: Update Sunday services

# Refreshes _data/sunday_services.json from the YouTube channel's latest uploads.
# The API key is read from the YOUTUBE_API_KEY repository secret and never exposed.

on:
  schedule:
    - cron: "0 16 * * 1"   # Mondays 16:00 UTC (~8-9am Pacific)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write            # push the update branch
  pull-requests: write       # open / auto-merge the PR

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch latest Sunday services
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch_sunday_services.py

      # master is a protected branch, so direct pushes are rejected. Instead we
      # push the refreshed data to a branch, open (or update) a PR, and merge it
      # ourselves. The repo has auto-merge disabled, so `gh pr merge --auto` is
      # not an option; we retry a plain merge while the deploy checks settle.
      - name: Open or update PR with refreshed data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain _data/sunday_services.json)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          BRANCH="auto/update-sermons"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add _data/sunday_services.json
          git commit -m "Update Sunday services from YouTube"
          git push -f origin "$BRANCH"

          # Create a PR only if there isn't already an open one for this branch.
          if [[ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" == "0" ]]; then
            gh pr create --base master --head "$BRANCH" \
              --title "Update Sunday services from YouTube" \
              --body "Automated weekly refresh of \`_data/sunday_services.json\` from the church YouTube channel."
          fi

          # Merge the PR. Branch protection requires a PR but not a human review,
          # so a green PR can be merged immediately. Checks (Netlify, Cloudflare)
          # take a couple of minutes to report, so retry for up to ~5 minutes.
          for attempt in $(seq 1 10); do
            if gh pr merge "$BRANCH" --merge; then
              echo "Merged on attempt $attempt."
              exit 0
            fi
            echo "Merge attempt $attempt failed; waiting for checks to settle..."
            sleep 30
          done

          # Fail loudly rather than leaving a stale PR open unnoticed.
          echo "::error::Could not merge $BRANCH after 10 attempts; PR left open for manual merge."
          exit 1
